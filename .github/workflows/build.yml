# Steps represent a sequence of tasks that will be executed as part of the job
steps:
  # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
  - uses: actions/checkout@v4

  # Sets up Bun, a fast JavaScript runtime and package manager
  - name: Setup Bunname: CI

on:
  push:
    branches: [ "new" ]
  pull_request:
    branches: [ "new" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Build Vue project
        run: bun run build
    uses: oven-sh/setup-bun@v1
    with:
      bun-version: latest

  # Caches Bun dependencies to speed up subsequent builds
  - name: Cache Bun dependencies
    id: cache
    uses: actions/cache@v3
    with:
      path: ~/.bun/install/cache
      key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
      restore-keys: |
        ${{ runner.os }}-bun-

  # Installs project dependencies using Bun
  - name: Install dependencies
    run: bun install

  # Builds the Vue project for production
  - name: Build Vue project
    run: bun run build
